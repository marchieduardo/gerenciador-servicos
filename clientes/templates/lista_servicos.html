<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Serviços</title>
</head>

<body>
    <h1>Lista de Serviços</h1>
    <ul>
        {% for servico in servicos %}
        <li>
            {{ servico.descricao }} - {{ servico.data }} - R$ {{ servico.valor }} - {{ servico.get_status_display }}
        </li>
        <hr>
        {% empty %}
        <li>Nenhum serviço cadastrado.</li>
        {% endfor %}
    </ul>

    <a href="{% url 'lista-clientes' %}">Voltar</a>
</body>

</html>
